# The booking widget's headers: security-headers.conf without X-Frame-Options, and with
# frame-ancestors taken from the origins an Owner allowed (issue #513). $embed_frame_ancestors is
# set by auth_request_set in the /embed location; the backend answers 'none' when nothing is
# allowed. Lives outside conf.d because nginx.conf includes conf.d/*.conf at the http level,
# where these would land on every location that sets no headers of its own.
add_header X-Content-Type-Options           "nosniff" always;
add_header X-XSS-Protection                 "1; mode=block" always;
add_header Referrer-Policy                  "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security        "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy               "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Cross-Origin-Opener-Policy       "same-origin" always;
add_header Cross-Origin-Resource-Policy     "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: *; font-src 'self' data:; connect-src 'self' *; frame-src https://www.openstreetmap.org; frame-ancestors $embed_frame_ancestors; base-uri 'self'; form-action 'self'" always;

proxy_hide_header                    X-Powered-By;
proxy_hide_header                    Server;
