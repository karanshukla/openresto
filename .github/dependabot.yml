# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/openresto-frontend"
      - "/docs-site"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    # The Expo SDK pins these to the versions its native code is built against
    # (expo/bundledNativeModules.json), so they move only with an `expo` bump:
    # check out that PR and run `npx expo install --fix` in openresto-frontend.
    # Exact pins take no update at all; range pins only patches within the range.
    ignore:
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-test-renderer"
      - dependency-name: "react-native"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-worklets"
      - dependency-name: "@react-native-community/datetimepicker"
      - dependency-name: "expo-*"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "jest-expo"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-gesture-handler"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-safe-area-context"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-web"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native/jest-preset"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/vector-icons"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/openresto-cli"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    # `typescript` is only the compiler API for openapi-typescript, which needs 5.x;
    # builds run on TypeScript 7 through the @typescript/native alias.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directories:
      - "/nginx"
      - "/nginx-vps"
    schedule:
      interval: "weekly"
