name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  deployments: write

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openresto-frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: openresto-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run oxlint
        run: npm run lint

      - name: Run Prettier Check
        run: npx prettier --check "**/*.{ts,tsx,js,json}"

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm test -- --ci --coverage --forceExit

      - name: Upload Frontend Coverage to Coveralls
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: openresto-frontend/coverage/lcov.info
          flag-name: frontend
          parallel: true
          fail-on-error: false

      - name: Upload Frontend Coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: openresto-frontend/coverage/

  routes:
    name: Route Manifest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openresto-frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: openresto-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      # Expo Router derives routes from the filesystem, so a non-route file under app/
      # silently becomes one — and a name matching a routing convention can re-parent the
      # tree. tsc, Jest and lint all stay green when that happens; only routing notices.
      - name: Check Route Manifest
        run: npm run routes:check

  doc-links:
    name: Doc Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The comment policy lets a test carry a business rule in place of prose, which
      # only holds while the code still points at that test. A link has no compiler
      # behind it, so a renamed test rots it silently and the rule goes undocumented.
      - name: Check Doc Links
        run: npm run check:doc-links

  openapi-drift:
    name: OpenAPI Drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: openresto-cli/package-lock.json

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

      - name: Regenerate OpenAPI document
        working-directory: tools/OpenApiExport
        run: dotnet run --no-build --configuration Release -- ../../openresto-cli/openapi/v1.json

      - name: Install CLI Dependencies
        working-directory: openresto-cli
        run: npm ci

      - name: Regenerate CLI transport types
        working-directory: openresto-cli
        run: npm run generate:types

      # Same shape as the frontend's Route Manifest job: the committed file is the source of
      # truth, and this job's only job is to prove `dotnet build` + the type generator still
      # reproduce it byte-for-byte. A diff here means someone changed an API shape without
      # regenerating openresto-cli/openapi/v1.json and src/generated/api.d.ts.
      - name: Check for drift
        run: |
          if ! git diff --exit-code -- openresto-cli/openapi/v1.json openresto-cli/src/generated/api.d.ts; then
            echo "::error::openresto-cli/openapi/v1.json and/or src/generated/api.d.ts are out of date."
            echo "Run: dotnet build && (cd tools/OpenApiExport && dotnet run --no-build -- ../../openresto-cli/openapi/v1.json) && (cd openresto-cli && npm run generate:types)"
            exit 1
          fi

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

      - name: Run Tests with Coverage
        run: >
          dotnet test --no-build --configuration Release --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings
          --results-directory TestResults

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report
        run: reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:"CoverageReport" -reporttypes:"Html;Cobertura;lcov"

      - name: Upload Backend Coverage to Coveralls
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: CoverageReport/lcov.info
          flag-name: backend
          parallel: true
          fail-on-error: false

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "TestResults/*.trx"

      - name: Upload Backend Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: "CoverageReport/"

      - name: Backend Coverage Summary
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "CoverageReport/Cobertura.xml"
          badge: true
          format: markdown
          output: both

      - name: Add Coverage to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          path: code-coverage-results.md

  coveralls:
    name: Coveralls Finish
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Finish Coveralls
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
          fail-on-error: false

  docker:
    name: Docker + ZAP
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Patch backend env file for CI
        run: |
          sed -i 's|CONNECTION_STRING=.*|CONNECTION_STRING=Data Source=/tmp/openresto.db|' \
            ./OpenRestoApi/.env.docker

      - name: Build all containers
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          for i in $(seq 1 90); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5062/api/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Backend is ready (HTTP 200)!"
              exit 0
            fi

            EXITED=$(docker compose ps --status exited --quiet)
            if [ -n "$EXITED" ]; then
              echo "Error: One or more containers have exited!"
              docker compose ps
              docker compose logs
              exit 1
            fi

            echo "Attempt $i/90: Backend not ready yet (HTTP $STATUS)..."
            if [ $((i % 5)) -eq 0 ]; then
              docker compose ps
            fi
            sleep 2
          done
          echo "Error: Services failed to become ready after 180 seconds."
          docker compose ps
          docker compose logs
          exit 1

      - name: Verify backend responds via nginx
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5062/api/health)
          echo "GET /api/health -> $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Verify frontend responds via nginx
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5062/)
          echo "GET / -> $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Verify security headers present
        run: |
          HEADERS=$(curl -sD - -o /dev/null http://localhost:5062/api/health)
          echo "$HEADERS"
          echo "$HEADERS" | grep -qi "x-content-type-options: nosniff" || exit 1
          echo "$HEADERS" | grep -qi "x-frame-options: DENY" || exit 1

      - name: Verify OpenAPI spec reachable via nginx
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5062/openapi/v1.json)
          echo "GET /openapi/v1.json -> $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: http://localhost:5062/openapi/v1.json
          rules_file_name: .zap-rules.tsv
          cmd_options: >
            -a
            -j
            -l WARN
            -z "-config api.disablekey=true
            -config openapi.targetUrl=http://localhost:5062
            -config spider.maxDuration=2
            -config scanner.maxScanDurationInMins=5"
          allow_issue_writing: false
          fail_action: true

      - name: Show ZAP vulnerabilities
        if: failure()
        run: |
          if [ -f report_md.md ]; then
            cat report_md.md
            cat report_md.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No markdown report found."
          fi

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
          if-no-files-found: ignore

      - name: Debug nginx config on failure
        if: failure()
        run: |
          echo "=== Rendered Nginx config ==="
          docker compose exec -T reverse-proxy cat /etc/nginx/conf.d/default.conf || echo "Could not read config"
          echo "=== Full Nginx config dump ==="
          docker compose exec -T reverse-proxy nginx -T || echo "Could not dump config"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail=100

  e2e-smoke:
    name: Playwright E2E (Smoke)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Patch backend env file for CI
        run: |
          sed -i 's|CONNECTION_STRING=.*|CONNECTION_STRING=Data Source=/tmp/openresto.db|' \
            ./OpenRestoApi/.env.docker

      - name: Build all containers
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          for i in $(seq 1 90); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5062/api/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Backend is ready (HTTP 200)!"
              exit 0
            fi

            EXITED=$(docker compose ps --status exited --quiet)
            if [ -n "$EXITED" ]; then
              echo "Error: One or more containers have exited!"
              docker compose ps
              docker compose logs
              exit 1
            fi

            echo "Attempt $i/90: Backend not ready yet (HTTP $STATUS)..."
            if [ $((i % 5)) -eq 0 ]; then
              docker compose ps
            fi
            sleep 2
          done
          echo "Error: Services failed to become ready after 180 seconds."
          docker compose ps
          docker compose logs
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: openresto-frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: openresto-frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: openresto-frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Smoke Tests
        working-directory: openresto-frontend
        env:
          ADMIN_EMAIL: admin@openresto.com
          ADMIN_PASSWORD: change-me-before-use
        run: npm run test:e2e:smoke

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-smoke
          path: openresto-frontend/playwright-report/
          if-no-files-found: ignore

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail=100

  e2e-extensive:
    name: Playwright E2E (Extensive)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    # Runs the rest of the suite beyond the @smoke subset (see e2e-smoke) — deliberately
    # main-only so PRs get fast feedback and the full-depth run happens once per merge.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Patch backend env file for CI
        run: |
          sed -i 's|CONNECTION_STRING=.*|CONNECTION_STRING=Data Source=/tmp/openresto.db|' \
            ./OpenRestoApi/.env.docker

      - name: Build all containers
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          for i in $(seq 1 90); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5062/api/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Backend is ready (HTTP 200)!"
              exit 0
            fi

            EXITED=$(docker compose ps --status exited --quiet)
            if [ -n "$EXITED" ]; then
              echo "Error: One or more containers have exited!"
              docker compose ps
              docker compose logs
              exit 1
            fi

            echo "Attempt $i/90: Backend not ready yet (HTTP $STATUS)..."
            if [ $((i % 5)) -eq 0 ]; then
              docker compose ps
            fi
            sleep 2
          done
          echo "Error: Services failed to become ready after 180 seconds."
          docker compose ps
          docker compose logs
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: openresto-frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: openresto-frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: openresto-frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Extensive Tests
        working-directory: openresto-frontend
        env:
          ADMIN_EMAIL: admin@openresto.com
          ADMIN_PASSWORD: change-me-before-use
        run: npm run test:e2e:extensive

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-extensive
          path: openresto-frontend/playwright-report/
          if-no-files-found: ignore

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail=100

  deploy:
    name: Deploy to VPS
    needs: [frontend, routes, backend, docker, e2e-smoke, e2e-extensive]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
